```yaml
#
# Serverless Framework configuration for AWS Lambda + API Gateway.
# Wraps the existing Vercel-style handlers in a single Express
# Lambda using serverless-http, so we get one HTTP API in front
# of all routes with native CORS + throttling.
#
service: upcat-simulator-api
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, "ap-southeast-1"}
  stage: ${opt:stage, "prod"}
  memorySize: 512
  timeout: 15
  architecture: arm64

  httpApi:
    cors:
      allowedOrigins:
        - ${env.FRONTEND_URL}
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
      allowCredentials: true
      maxAge: 86400
      # Pull secrets from SSM Parameter Store so they never live in source.
    environment:
      NODE_ENV: production
      MONGODB_URI: ${ssm:/upcat/${self:provider.stage}/MONGODB_URI~true}
      MONGODB_DB_NAME: ${ssm:/upcat/${self:provider.stage}/MONGODB_DB_NAME}
      JWT_SECRET: ${ssm:/upcat/${self:provider.stage}/JWT_SECRET~true}
      JWT_EXPIRY: ${ssm:/upcat/${self:provider.stage}/JWT_EXPIRY, "7d"}
      FRONTEND_URL: ${env.FRONTEND_URL}
      APP_URL: ${env.FRONTEND_URL}
      EMAIL_FROM: ${ssm:/upcat/${self:provider.stage}/EMAIL_FROM}
      EMAIL_SERVICE_API_KEY: ${ssm:/upcat/${self:provider.stage}/EMAIL_SERVICE_API_KEY~true}
      RESEND_API_KEY: ${ssm:/upcat/${self:provider.stage}/RESEND_API_KEY~true}
      DEVELOPER_EMAIL: ${ssm:/upcat/${self:provider.stage}/DEVELOPER_EMAIL}

functions:
  api:
    handler: api/dist/lambda.handler
events:
  - httpApi: "ANY /{proxy+}"
  - httpApi: "ANY /"

package:
  individually: false

patterns:
  - "!**"
  - "api/dist/**"
  - "api/package.json"
  - "shared/**"
  - "package.json"
  - "package-lock.json"
  - "!**/*.test.*"
  - "!**/__tests__/**"

custom:
  # Per-route throttling at the API Gateway layer. Per-IP/per-user
  # quotas are enforced inside the handler via security.ts.
  throttling:
    burstLimit: 50
    rateLimit: .25